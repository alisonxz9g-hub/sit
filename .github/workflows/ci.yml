name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The test suite generates its fixtures with a real encoder and cross-checks the
      # parser against ffprobe, so both binaries have to be present. Fixtures are not
      # committed: hand-written ones only contain the structures their author already
      # thought of.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate fixtures
        run: npm run fixtures

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the build boots
        run: npm run smoke

  # Separate job: it needs a browser download, and the point is to exercise the one path
  # nothing else can reach. ffmpeg.wasm has broken twice in ways every other check passed.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate fixtures
        run: npm run fixtures

      - name: Build
        run: npm run build

      - name: Drive the real UI in a browser
        run: npm run browser-check
